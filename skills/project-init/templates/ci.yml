name: ci

on:
  push:
    branches: [{{MAIN_BRANCH}}]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/{{MAIN_BRANCH}}' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: skeleton check
        run: uvx --from git+https://github.com/1morr/skills 1morr-skel check
      # M0 的第一張票：將本技術棧的 format、lint、typecheck 與 test 接在這裡，與 docs/development.md〈全部檢查〉保持同一組
