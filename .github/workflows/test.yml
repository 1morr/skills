name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: diff
        run: |
          # diff.py 的 docx 與 pdf 抽字要 python-docx 和 PyMuPDF
          pip install python-docx pymupdf
          python -m unittest discover -s skills/diff/tests -v
      - name: explain
        run: python -m unittest discover -s skills/explain/tests -v
      - name: orca scripts
        run: bash orca/scripts/selftest.sh
      - name: tutor
        run: |
          # crop.py 的翻譯圖測試要 PyMuPDF 和 Pillow
          pip install pymupdf pillow
          python -m unittest discover -s skills/tutor/tests -v
